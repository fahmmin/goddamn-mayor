<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- connect-src is the only reason this policy is not still default-src 'self'.
     src/*.js never reaches the network; web3/bundle.js does. Hosts are listed
     one per purpose so it is obvious what talks to what.

     The one wildcard is the saved city. Its host is the Supabase project in
     web3/config.json, which is generated - pinning the project here would
     mean editing this file on every redeploy and would break any fork that
     brings its own project. The narrowing that matters is done by the Edge
     Function, which serves nothing without a verified Privy token. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  style-src 'self' 'unsafe-inline';
  script-src 'self';
  img-src 'self' data:;
  frame-src https://auth.privy.io;
  connect-src 'self'
    http://localhost:8787
    https://api.studio.thegraph.com
    https://gateway.thegraph.com
    https://ethereum-sepolia-rpc.publicnode.com
    https://rpc.sepolia.org
    https://auth.privy.io
    https://api.privy.io
    https://*.supabase.co;
">
<title>I'M THE GODDAMN MAYOR</title>
<meta name="description" content="You have watched a city get it wrong. The bus line went the wrong way, the money landed in the wrong district. Had that moment? Good. Take the office.">
<meta property="og:type" content="website">
<meta property="og:title" content="I'M THE GODDAMN MAYOR">
<meta property="og:description" content="You have watched a city get it wrong. The bus line went the wrong way, the money landed in the wrong district. Had that moment? Good. Take the office.">
<meta property="og:url" content="/">
<meta property="og:image" content="/src/img/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The title screen - I'M THE GODDAMN MAYOR, over an isometric city seen from above.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="I'M THE GODDAMN MAYOR">
<meta name="twitter:description" content="You have watched a city get it wrong. The bus line went the wrong way, the money landed in the wrong district. Had that moment? Good. Take the office.">
<meta name="twitter:image" content="/src/img/og.jpg">
<!-- Icons are relative, so the page still finds them when it is opened from
     file:// as well as from a host. The card image is the exception: the
     crawlers that read it resolve it against the site root, and none of them
     ever see a file:// copy. -->
<link rel="icon" href="src/img/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="src/img/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="src/img/icon-512.png">
<link rel="apple-touch-icon" href="src/img/apple-touch-icon.png">
<link rel="stylesheet" href="src/style.css">
<!-- The carriage is 1.9MB and it is the whole of the title screen's conceit.
     Requested here rather than when shell.js builds the <img>, so it is
     downloading alongside the scripts instead of after them - otherwise the
     frame arrives a beat late and the copy sits on a bare city first. -->
<link rel="preload" as="image" href="src/img/carriage.png">
</head>
<!-- Both classes come from the markup rather than from script, because
     there is no earlier moment available: the CSP is script-src 'self', so
     there is no inline script to set them in, and shell.js is at the bottom
     of the body. obs-open hides the HUD, which belongs to the game and not to
     the title screen; obs-boot holds the canvas back until the shell has
     aimed the camera at the first stop. Setting them from JS instead meant
     the bare city was painted first and then taken away, which is the flash
     everyone saw on load. shell.js drops obs-boot as it opens and obs-open
     when the camera lands in the city. -->
<body class="obs-boot obs-open">
  <div id="app">
    <canvas id="city"></canvas>
    <div id="hud"></div>
  </div>
  <script src="src/state.js"></script>
  <script src="src/districts.js"></script>
  <script src="src/gfx.js"></script>
  <script src="src/materials.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/policies.js"></script>
  <script src="src/events.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/ground.js"></script>
  <script src="src/roofs.js"></script>
  <script src="src/props.js"></script>
  <script src="src/lots.js"></script>
  <script src="src/ens.js"></script>
  <script src="src/quests.js"></script>
  <script src="src/light.js"></script>
  <script src="src/bridges.js"></script>
  <script src="src/landmarks.js"></script>
  <script src="src/sky.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/demo.js"></script>
  <script src="src/tour.js"></script>
  <script src="src/game.js"></script>
  <!-- The inspector loads after game.js for the same reason shell.js does:
       it drives MM.renderer, which game.js creates. It never edits it. -->
  <script src="src/inspect.js"></script>
  <!-- Lenis, vendored rather than fetched: a local file keeps CSP at
       default-src 'self', works offline and needs no build step. The shell
       falls back to native scroll if this tag is removed. -->
  <script src="vendor/lenis.min.js"></script>
  <!-- The shell loads after game.js because it drives MM.state and
       MM.renderer, which game.js creates. It never edits either. -->
  <script src="src/shell.js"></script>
  <!-- The chain layer, bundled separately and loaded last. It writes
       state.chain and nothing else. Remove this one tag and the page is
       exactly the game it was before: src/*.js never reaches the network. -->
  <script defer src="web3/bundle.js"></script>
</body>
</html>
