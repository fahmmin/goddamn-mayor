<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- connect-src is the only reason this policy is not still default-src 'self'.
     src/*.js never reaches the network; web3/bundle.js does. Hosts are listed
     one per purpose so it is obvious what talks to what. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  style-src 'self' 'unsafe-inline';
  script-src 'self';
  img-src 'self' data:;
  frame-src https://auth.privy.io;
  connect-src 'self'
    http://localhost:8787
    https://api.studio.thegraph.com
    https://gateway.thegraph.com
    https://ethereum-sepolia-rpc.publicnode.com
    https://rpc.sepolia.org
    https://auth.privy.io
    https://api.privy.io;
">
<title>OBSICITY — the city is a public company</title>
<link rel="icon" type="image/svg+xml" href="src/favicon.svg">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="app">
    <canvas id="city"></canvas>
    <div id="hud"></div>
  </div>
  <script src="src/state.js"></script>
  <script src="src/districts.js"></script>
  <script src="src/gfx.js"></script>
  <script src="src/materials.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/policies.js"></script>
  <script src="src/events.js"></script>
  <script src="src/sim.js"></script>
  <script src="src/ground.js"></script>
  <script src="src/roofs.js"></script>
  <script src="src/props.js"></script>
  <script src="src/lots.js"></script>
  <script src="src/light.js"></script>
  <script src="src/bridges.js"></script>
  <script src="src/landmarks.js"></script>
  <script src="src/sky.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/demo.js"></script>
  <script src="src/game.js"></script>
  <!-- The shell loads after game.js because it drives MM.state and
       MM.renderer, which game.js creates. It never edits either. -->
  <script src="src/shell.js"></script>
  <!-- The chain layer, bundled separately and loaded last. It writes
       state.chain and nothing else. Remove this one tag and the page is
       exactly the game it was before: src/*.js never reaches the network. -->
  <script defer src="web3/bundle.js"></script>
</body>
</html>
